<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn English</title>
  <meta name="description" content="Simple English lessons: all 12 tenses, how to ask questions, everyday vocabulary and the most common mistakes.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">English Helper</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Checker</a>
        <a href="learn.html" aria-current="page">Learn</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Learn</h1>
    <p class="lead">Short, simple lessons. Open any one and tap “Try it” to test an example in the checker.</p>

    <div class="tabs" role="tablist" aria-label="Topics">
      <button type="button" role="tab" data-tab="tenses" aria-controls="panel">Tenses</button>
      <button type="button" role="tab" data-tab="questions" aria-controls="panel">Asking questions</button>
      <button type="button" role="tab" data-tab="vocabulary" aria-controls="panel">Vocabulary</button>
      <button type="button" role="tab" data-tab="mistakes" aria-controls="panel">Common mistakes</button>
    </div>

    <input type="search" class="search" id="search" placeholder="Search this topic…" aria-label="Search this topic">
    <div id="panel" role="tabpanel"></div>
  </main>

  <script src="learn-data.js"></script>
  <script src="learn.js"></script>
</body>
</html>
