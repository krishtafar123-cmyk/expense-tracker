<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker — Log In</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Expenses" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Icon sprite, same approach as the dashboard: inline, so the login page
       still makes no request beyond the Inter webfont. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false"><defs>
    <symbol id="i-sunrise" viewBox="0 0 24 24"><path d="M12 3v6M8.5 6.5 12 3l3.5 3.5"/><path d="M2.5 18.5h19"/><path d="M6.5 15a5.5 5.5 0 0 1 11 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.25"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M9 5h10.5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L2.5 12Z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></symbol>
  </defs></svg>

  <div class="auth-screen">
    <div class="auth-card">

      <div class="greeting">
        <div class="greeting-emoji" id="greeting-emoji" aria-hidden="true"><svg class="icon"><use href="#i-sun"/></svg></div>
        <h1 id="greeting-text">Hello</h1>
        <p class="auth-subtitle" id="auth-subtitle">Log in to Expense Tracker</p>
      </div>

      <!-- Step: email -->
      <div id="step-email" class="auth-step">
        <label class="field">
          Email
          <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email" />
        </label>
        <div id="email-error" class="auth-error" role="alert" hidden></div>
        <button id="email-continue-btn" class="btn btn-primary btn-block">Continue</button>
        <p class="auth-toggle">
          <span id="email-toggle-text">Don't have an account?</span>
          <button id="email-toggle-btn" class="link-btn">Create one</button>
        </p>
      </div>

      <!-- Step: pin -->
      <div id="step-pin" class="auth-step" hidden>
        <p class="pin-heading" id="pin-heading">Enter your PIN</p>
        <p class="pin-subheading" id="pin-subheading"></p>

        <div class="pin-dots" id="pin-dots" aria-hidden="true">
          <span class="pin-dot" data-i="0"></span>
          <span class="pin-dot" data-i="1"></span>
          <span class="pin-dot" data-i="2"></span>
          <span class="pin-dot" data-i="3"></span>
          <span class="pin-dot" data-i="4"></span>
          <span class="pin-dot" data-i="5"></span>
        </div>
        <p id="pin-progress" class="sr-only" role="status" aria-live="polite"></p>

        <div id="pin-error" class="auth-error" role="alert" hidden></div>
        <p id="pin-info" class="auth-info" role="status" aria-live="polite" hidden></p>

        <div class="pin-pad">
          <button class="pin-key" data-digit="1">1</button>
          <button class="pin-key" data-digit="2">2</button>
          <button class="pin-key" data-digit="3">3</button>
          <button class="pin-key" data-digit="4">4</button>
          <button class="pin-key" data-digit="5">5</button>
          <button class="pin-key" data-digit="6">6</button>
          <button class="pin-key" data-digit="7">7</button>
          <button class="pin-key" data-digit="8">8</button>
          <button class="pin-key" data-digit="9">9</button>
          <span></span>
          <button class="pin-key" data-digit="0">0</button>
          <button class="pin-key pin-key-back" id="pin-backspace" aria-label="Backspace"><svg class="icon" aria-hidden="true"><use href="#i-backspace"/></svg></button>
        </div>

        <p class="auth-toggle auth-toggle-split">
          <button id="pin-back-btn" class="link-btn">‹ Back</button>
          <button id="forgot-pin-btn" class="link-btn">Forgot PIN?</button>
        </p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="auth.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
