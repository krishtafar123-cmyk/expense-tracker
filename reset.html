<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker — Set a New PIN</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Expenses" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Icon sprite, same approach as the other pages: inline, no extra request. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false"><defs>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="16.5" r="4.5"/><path d="M10.7 13.3 20 4"/><path d="M17 7l2.5 2.5M14.5 9.5 17 12"/></symbol>
    <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M9 5h10.5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L2.5 12Z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></symbol>
  </defs></svg>

  <div class="auth-screen">
    <div class="auth-card">

      <div class="greeting">
        <div class="greeting-emoji" aria-hidden="true"><svg class="icon"><use href="#i-key"/></svg></div>
        <h1 id="reset-title">Set a new PIN</h1>
        <p class="auth-subtitle" id="reset-subtitle">Checking your link…</p>
      </div>

      <!-- Shown while the recovery link is being verified -->
      <div id="step-checking" class="auth-step">
        <div class="loading-bar"></div>
      </div>

      <!-- Shown when the link is valid -->
      <div id="step-pin" class="auth-step" hidden>
        <p class="pin-heading" id="pin-heading">Choose a 6-digit PIN</p>
        <p class="pin-subheading" id="pin-subheading"></p>

        <div class="pin-dots" id="pin-dots" aria-hidden="true">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <p id="pin-progress" class="sr-only" role="status" aria-live="polite"></p>

        <div id="pin-error" class="auth-error" role="alert" hidden></div>
        <p id="pin-info" class="auth-info" role="status" aria-live="polite" hidden></p>

        <div class="pin-pad">
          <button class="pin-key" data-digit="1">1</button>
          <button class="pin-key" data-digit="2">2</button>
          <button class="pin-key" data-digit="3">3</button>
          <button class="pin-key" data-digit="4">4</button>
          <button class="pin-key" data-digit="5">5</button>
          <button class="pin-key" data-digit="6">6</button>
          <button class="pin-key" data-digit="7">7</button>
          <button class="pin-key" data-digit="8">8</button>
          <button class="pin-key" data-digit="9">9</button>
          <span></span>
          <button class="pin-key" data-digit="0">0</button>
          <button class="pin-key pin-key-back" id="pin-backspace" aria-label="Backspace"><svg class="icon" aria-hidden="true"><use href="#i-backspace"/></svg></button>
        </div>
      </div>

      <!-- Shown when the link is missing, invalid or expired -->
      <div id="step-invalid" class="auth-step" hidden>
        <div class="auth-error" id="invalid-text">This reset link is invalid or has expired.</div>
        <a class="btn btn-primary btn-block" href="index.html" style="display:block;text-align:center;text-decoration:none;">Back to log in</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="reset.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
